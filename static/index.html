<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --work: #4f6bff;
  --personal: #ff4f9a;
  --study: #ffb020;
  --health: #17c48a;
  --ink: #1d1b3a;
  --muted: #8a87a8;
  --line: #ece9f7;
  --card: #ffffff;
  --grad: linear-gradient(135deg, #7c4dff 0%, #ff4f9a 100%);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 40px 16px 60px;
  background: linear-gradient(160deg, #2b1a6b 0%, #5b2a9e 45%, #c2379b 100%);
  background-attachment: fixed;
  position: relative;
  overflow-x: hidden;
}
.blob { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .55; z-index: 0; pointer-events: none; }
.b1 { width: 320px; height: 320px; background: #4f6bff; top: -80px; left: -80px; }
.b2 { width: 280px; height: 280px; background: #ffb020; bottom: -90px; right: -60px; opacity: .4; }
.b3 { width: 240px; height: 240px; background: #17c48a; top: 45%; right: -100px; opacity: .35; }

.app {
  position: relative; z-index: 1;
  width: 100%; max-width: 600px; align-self: flex-start;
  background: var(--card);
  border-radius: 28px;
  padding: 32px;
  box-shadow: 0 30px 80px rgba(20, 8, 60, .45);
}
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
.date { margin: 0 0 2px; color: var(--muted); font-size: .85rem; font-weight: 500; }
h1 { margin: 0; font-size: 2.2rem; font-weight: 800; letter-spacing: -.02em; }
.badge {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--grad); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 1.05rem;
  box-shadow: 0 10px 24px rgba(255, 79, 154, .4);
}

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat { border-radius: 16px; padding: 14px 16px; color: #fff; display: flex; flex-direction: column; }
.stat strong { font-size: 1.7rem; line-height: 1.1; font-weight: 700; }
.stat span { font-size: .8rem; opacity: .9; font-weight: 500; }
.s-total { background: linear-gradient(135deg, #4f6bff, #7c4dff); }
.s-open  { background: linear-gradient(135deg, #ffb020, #ff7a3d); }
.s-done  { background: linear-gradient(135deg, #17c48a, #0fa3a3); }

.progress { height: 10px; background: var(--line); border-radius: 99px; margin: 20px 0 24px; overflow: hidden; }
.progress span { display: block; height: 100%; width: 0; background: var(--grad); border-radius: 99px; transition: width .4s ease; }

#add-form { display: flex; gap: 8px; flex-wrap: wrap; }
#add-form input, #add-form select {
  font: inherit; color: inherit; background: #f6f4ff;
  border: 2px solid transparent; border-radius: 14px; padding: 13px 14px;
}
#add-form input { flex: 1 1 200px; min-width: 0; }
#add-form select { cursor: pointer; font-weight: 500; }
#add-form input:focus, #add-form select:focus { outline: none; border-color: #7c4dff; background: #fff; }
button { font: inherit; cursor: pointer; }
#add-form button {
  background: var(--grad); color: #fff; border: 0; font-weight: 600;
  padding: 0 22px; border-radius: 14px; min-height: 48px;
  box-shadow: 0 8px 20px rgba(124, 77, 255, .35);
  transition: transform .15s ease;
}
#add-form button:hover { transform: translateY(-1px); }
button:focus-visible { outline: 3px solid #7c4dff; outline-offset: 2px; }

.filters { display: flex; gap: 8px; margin: 22px 0 10px; }
.filters button {
  background: #f6f4ff; border: 0; color: var(--muted);
  padding: 8px 18px; border-radius: 99px; font-weight: 600; font-size: .85rem;
}
.filters button.active { background: var(--ink); color: #fff; }

ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
li {
  --c: var(--work);
  display: flex; align-items: center; gap: 12px;
  background: #fff; border: 1px solid var(--line);
  border-left: 6px solid var(--c);
  border-radius: 14px; padding: 12px 14px;
  box-shadow: 0 4px 14px rgba(60, 40, 120, .06);
}
li[data-cat="work"] { --c: var(--work); }
li[data-cat="personal"] { --c: var(--personal); }
li[data-cat="study"] { --c: var(--study); }
li[data-cat="health"] { --c: var(--health); }

li input[type="checkbox"] {
  appearance: none; flex: none; width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--c); background: transparent; cursor: pointer;
  display: grid; place-content: center;
}
li input[type="checkbox"]:checked { background: var(--c); }
li input[type="checkbox"]:checked::after {
  content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(45deg) translate(-1px, -1px);
}
.body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.text { word-break: break-word; font-weight: 500; }
.tag {
  align-self: flex-start; font-size: .7rem; font-weight: 600;
  color: var(--c); background: color-mix(in srgb, var(--c) 14%, white);
  padding: 2px 10px; border-radius: 99px;
}
li.done .text { color: var(--muted); text-decoration: line-through; }
li.done { opacity: .75; }
.edit-input { width: 100%; font: inherit; background: #f6f4ff; border: 2px solid #7c4dff; border-radius: 10px; padding: 6px 10px; color: inherit; }

.actions { display: flex; gap: 4px; }
.actions button {
  background: #f6f4ff; border: 0; color: var(--muted);
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
}
.actions button:hover { background: #ebe6ff; color: #5b2a9e; }
.actions .del:hover { background: #ffe3ec; color: #e0264f; }
.actions svg { width: 16px; height: 16px; }

.empty { text-align: center; color: var(--muted); padding: 24px 0 8px; font-weight: 500; }
.empty-emoji { display: block; font-size: 2.4rem; margin-bottom: 6px; }
footer { margin-top: 16px; text-align: right; }
.link { background: none; border: 0; color: var(--muted); font-size: .85rem; font-weight: 500; }
.link:hover { color: #e0264f; }

@media (max-width: 480px) {
  .app { padding: 22px; border-radius: 22px; }
  h1 { font-size: 1.8rem; }
  .stat strong { font-size: 1.4rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

  <main class="app">
    <header>
      <div>
        <p class="date" id="date"></p>
        <h1>My Tasks</h1>
      </div>
      <div class="badge" id="percent">0%</div>
    </header>

    <section class="stats">
      <div class="stat s-total"><strong id="n-total">0</strong><span>Total</span></div>
      <div class="stat s-open"><strong id="n-open">0</strong><span>Open</span></div>
      <div class="stat s-done"><strong id="n-done">0</strong><span>Done</span></div>
    </section>

    <div class="progress" aria-hidden="true"><span id="bar"></span></div>

    <form id="add-form" autocomplete="off">
      <input id="new-task" type="text" placeholder="Add a new task..." aria-label="New task" maxlength="120" required>
      <select id="new-cat" aria-label="Category">
        <option value="work">Work</option>
        <option value="personal">Personal</option>
        <option value="study">Study</option>
        <option value="health">Health</option>
      </select>
      <button type="submit" aria-label="Add task">+ Add</button>
    </form>

    <nav class="filters" aria-label="Filter tasks">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Open</button>
      <button data-filter="done">Done</button>
    </nav>

    <ul id="list"></ul>
    <p id="empty" class="empty" hidden>
      <span class="empty-emoji">🎯</span>
      No tasks here yet. Add one above to get started.
    </p>

    <footer>
      <button id="clear-done" class="link">Clear completed</button>
    </footer>
  </main>
  <script>
const KEY = "todo.tasks.v2";
const LABELS = { work: "Work", personal: "Personal", study: "Study", health: "Health" };
const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const ICON_DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';

let tasks = [];
let filter = "all";
let editingId = null;

const $ = (s) => document.querySelector(s);
const list = $("#list");

function load() {
  try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; }
  catch { tasks = []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch {}
}

function render() {
  const visible = tasks.filter((t) =>
    filter === "all" ? true : filter === "done" ? t.done : !t.done
  );
  list.innerHTML = "";
  visible.forEach((t) => {
    const li = document.createElement("li");
    li.dataset.cat = t.cat;
    if (t.done) li.classList.add("done");

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = t.done;
    cb.setAttribute("aria-label", "Mark complete");
    cb.onchange = () => { t.done = cb.checked; save(); render(); };
    li.appendChild(cb);

    const body = document.createElement("div");
    body.className = "body";

    if (editingId === t.id) {
      const input = document.createElement("input");
      input.className = "edit-input";
      input.value = t.text;
      input.maxLength = 120;
      const commit = () => {
        const v = input.value.trim();
        if (v) t.text = v;
        editingId = null; save(); render();
      };
      input.onkeydown = (e) => {
        if (e.key === "Enter") commit();
        if (e.key === "Escape") { editingId = null; render(); }
      };
      input.onblur = commit;
      body.appendChild(input);
      li.appendChild(body);
      setTimeout(() => input.focus(), 0);
    } else {
      const span = document.createElement("span");
      span.className = "text";
      span.textContent = t.text;
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = LABELS[t.cat] || "Personal";
      body.append(span, tag);
      li.appendChild(body);

      const actions = document.createElement("div");
      actions.className = "actions";
      const edit = document.createElement("button");
      edit.innerHTML = ICON_EDIT;
      edit.setAttribute("aria-label", "Edit task");
      edit.onclick = () => { editingId = t.id; render(); };
      const del = document.createElement("button");
      del.innerHTML = ICON_DEL;
      del.className = "del";
      del.setAttribute("aria-label", "Delete task");
      del.onclick = () => { tasks = tasks.filter((x) => x.id !== t.id); save(); render(); };
      actions.append(edit, del);
      li.appendChild(actions);
    }
    list.appendChild(li);
  });

  $("#empty").hidden = visible.length > 0;
  const total = tasks.length;
  const done = tasks.filter((t) => t.done).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  $("#n-total").textContent = total;
  $("#n-open").textContent = total - done;
  $("#n-done").textContent = done;
  $("#percent").textContent = pct + "%";
  $("#bar").style.width = pct + "%";
}

$("#add-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = $("#new-task");
  const text = input.value.trim();
  if (!text) return;
  tasks.unshift({ id: Date.now().toString(36), text, cat: $("#new-cat").value, done: false });
  input.value = "";
  save(); render();
});

document.querySelectorAll(".filters button").forEach((b) => {
  b.onclick = () => {
    filter = b.dataset.filter;
    document.querySelectorAll(".filters button").forEach((x) => x.classList.toggle("active", x === b));
    render();
  };
});

$("#clear-done").onclick = () => { tasks = tasks.filter((t) => !t.done); save(); render(); };

$("#date").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

load();
render();

</script>
</body>
</html>
